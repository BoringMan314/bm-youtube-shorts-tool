<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="popupTitle"></title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="header-icon" src="icons/icon.png" width="42" height="42" alt="" />
      <div class="header-copy">
        <h1 data-i18n="popupTitle"></h1>
        <p data-i18n="extDescription"></p>
      </div>
    </header>

    <main>
      <section class="settings-section" aria-labelledby="playbackHeading">
        <h2 class="section-title" id="playbackHeading" data-i18n="popupPlaybackGroup"></h2>
        <div class="cards">
          <div class="card setting-card">
            <span class="card-title" data-i18n="popupDefaultShortSpeedLabel"></span>
            <button type="button" id="btnDefaultSpeed" class="footer-link speed-button">
              <span id="lblDefaultSpeed">1×</span>
              <span class="button-hint" aria-hidden="true">↻</span>
            </button>
          </div>
          <div class="card setting-card">
            <span class="card-title" data-i18n="popupDefaultHoldSpeedLabel"></span>
            <button type="button" id="btnHoldSpeed" class="footer-link speed-button">
              <span id="lblHoldSpeed">2×</span>
              <span class="button-hint" aria-hidden="true">↻</span>
            </button>
          </div>
        </div>
      </section>

      <section class="settings-section" aria-labelledby="autoplayHeading">
        <h2 class="section-title" id="autoplayHeading" data-i18n="popupAutoplayGroup"></h2>
        <div class="cards">
          <label class="card setting-card" for="toggleAutoNext">
            <span class="card-title" data-i18n="popupAutoNextLabel"></span>
            <span class="switch">
              <input id="toggleAutoNext" type="checkbox" role="switch" />
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </label>
          <label class="card setting-card" for="inputLoopCount" id="loopCountRow">
            <span class="card-title" data-i18n="popupLoopCountLabel"></span>
            <input
              id="inputLoopCount"
              class="number-input"
              type="number"
              min="1"
              max="999"
              step="1"
              value="2"
              inputmode="numeric"
            />
          </label>
        </div>
      </section>

      <section class="settings-section" aria-labelledby="controlsHeading">
        <h2 class="section-title" id="controlsHeading" data-i18n="popupControlsGroup"></h2>
        <div class="cards">
          <label class="card setting-card" for="toggleArrowVolume">
            <span class="card-title" data-i18n="popupArrowVolumeLabel"></span>
            <span class="switch">
              <input id="toggleArrowVolume" type="checkbox" role="switch" />
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </label>
          <label class="card setting-card" for="togglePanelExpandRight">
            <span class="card-title" data-i18n="popupPanelExpandRightLabel"></span>
            <span class="switch">
              <input id="togglePanelExpandRight" type="checkbox" role="switch" />
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </label>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
